# Free demo: remote libSQL database is required. No paid disk/service.
services:
  - type: web
    name: denso-smartmaint-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SMARTMAINT_STORAGE
        value: turso
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SMARTMAINT_SECURE_COOKIE
        value: "1"
      - key: SMARTMAINT_DEMO_ROLE_SELECTION
        value: "1"
      - key: SMARTMAINT_ANSWER_MODE
        value: template
      - key: SMARTMAINT_RETRIEVAL_MODE
        value: keyword
