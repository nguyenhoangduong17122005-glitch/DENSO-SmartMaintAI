# Optional Render deployment. A service with a persistent disk is paid.
# Review cost in Render before creating this Blueprint.
services:
  - type: web
    name: denso-smartmaint-demo
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: smartmaint-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SMARTMAINT_SECURE_COOKIE
        value: "1"
      - key: SMARTMAINT_DEMO_ROLE_SELECTION
        value: "1"
      - key: SMARTMAINT_ANSWER_MODE
        value: template
      - key: SMARTMAINT_RETRIEVAL_MODE
        value: keyword
